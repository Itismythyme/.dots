# --- Autostart ---
# syncthing
exec_once=/mnt/backup/Downloads/Syncthing/syncthing

# swayidle
exec_once=swayidle -w timeout 240 'brightnessctl -s set 10%-' resume 'brightnessctl -r' timeout 270 'brightnessctl set 10%-' timeout 300 'swaylock -f; sleep 1; systemctl suspend' before-sleep 'swaylock -f'

# waybar
exec_once=waybar

# fcitx5
exec_once=fcitx5

# Mic Mute LED off
exec=brightnessctl -d platform::micmute set 0

# polkit
exec_once=lxpolkit

# persistent kitty term for fast executions
exec=kitty -1 --detach --start-as hidden -o allow_remote_control=socket-only --listen-on unix:@kitty sh -c 'exec sleep infinity'
