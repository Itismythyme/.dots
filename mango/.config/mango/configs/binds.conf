# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# --- General Binds ---
# reload config
bind=SUPER,r,reload_config

# toggle bar
bind=NONE,XF86NotificationCenter,spawn,killall -SIGUSR1 waybar

# --- Monitor Binds ---
# turn laptop monitor off
bind=NONE,XF86HangupPhone,spawn,mmsg dispatch disable_monitor,eDP-1
# turn laptop monitor on
bind=NONE,XF86PickupPhone,spawn,mmsg dispatch enable_monitor,eDP-1

# exit
bind=SUPER,e,quit
bind=SUPER,q,killclient,
# ---

# --- App binds ----
# Terminal
#bind=SUPER,Return,spawn,sh -c 'kitten @ --to unix:@kitty focus-window --match "title:fzf-popup" 2>/dev/null || kitty -1'
bind=SUPER,Return,spawn,kitty -1

# app launcher
bind=SUPER,d,spawn,$HOME/.dots/scripts/fzf-app-launcher.sh

# wlogout
bind=SUPER,period,spawn,wlogout -b 2

# File Manager
bind=SUPER,f,spawn,thunar

# Nvim
bind=NONE,XF86Favorites,spawn,sh -c 'kitten @ --to unix:@kitty launch --type=os-window nvim'

# Browser
bind=SUPER,b,spawn,env MOZ_ENABLE_WAYLAND=1 librewolf --profile "/home/OttoMarine/.config/librewolf/librewolf/a8ykxvxs.Main/"
bind=SUPER+SHIFT,B,spawn,env MOZ_ENABLE_WAYLAND=1 librewolf --profile "/home/OttoMarine/.config/librewolf/librewolf/Fbb4v3oJ.Profile 1/"
# ---

# --- Script Binds ---
bind=NONE,Print,spawn,~/.dots/scripts/screenshots.sh

# --- Layout Binds ---
# switch layout
bind=SUPER,n,switch_layout

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize
# ---
