# Keyboard
repeat_rate=40
repeat_delay=300
xkb_rules_layout=us
xkb_rules_options=caps:escape

# Mouse
mouse_natural_scrolling=0
mouse_accel_profile=0
mouse_accel_speed=-1
mouse_left_handed=0
mouse_scroll_method=1
mouse_click_method=1

# Trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_accel_profile=2
trackpad_accel_speed=0
trackpad_scroll_method=1
trackpad_click_method=1
trackpad_disable_while_typing=0

# Thinkpad Trackpoint disable
device_rule=name:TPPS/2 IBM TrackPoint,send_events_mode:1,accel_speed:1.0,accel_profile:2
