# Laptop: 1920x1080 at 60 Hz, scale 1.25, at the origin
monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1.25

# HP W2207: replace HDMI-A-1 with the actual output name from wlr-randr
monitor_rule=name:^HDMI-A-1$,width:1680,height:1050,refresh:60,x:1536,y:0,scale:1

# Other HDMI monitor: replace the pattern if its output name differs.
# Omitting width/height/refresh lets mango use its selected/default mode.
monitor_rule=name:^HDMI-A-.*,x:1536,y:0,scale:1

#for the server
monitor_rule=make:Hewlett Packard,model:HP w2207,width:1680,height:1050,refresh:60,x:0,y:0,scale:1,rr:2
